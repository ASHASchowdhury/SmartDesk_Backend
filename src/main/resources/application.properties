# Application Configuration
spring.application.name=OfficeProject

# Server Configuration
server.port=8080
server.servlet.session.timeout=30m

# Gemini Configuration
gemini.api.key=AIzaSyA0lbrJdKD_ieb2Gx9QIhMOBt4nL6xPIx0

# Database Configuration - USING YOUR PORT 5433
spring.datasource.url=jdbc:postgresql://localhost:5433/officeproject
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Hikari Connection Pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Logging Configuration
logging.level.com.OfficeManagement.OfficeProject=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# CORS Configuration
cors.allowed-origins=http://localhost:3000